services:
  traefik:
    image: traefik:3.6.7
    container_name: gallery-traefik
    restart: unless-stopped
    command:
      - "traefik"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik-acme:/acme
    networks:
      - gallery-network

  mariadb:
    image: mariadb:11.8.5
    container_name: gallery-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      TZ: America/New_York
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - gallery-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: gallery-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - gallery-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gallery-backend
    restart: unless-stopped
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: mysql+pymysql://${MARIADB_USER}:${MARIADB_PASSWORD}@mariadb:3306/${MARIADB_DATABASE}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-524288000}
      CHUNK_SIZE: ${CHUNK_SIZE:-5242880}
      TZ: America/New_York
    volumes:
      - gallery-data:/app/data
    networks:
      - gallery-network
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # Individual image serving (generous limit)
      - "traefik.http.routers.backend-images.rule=(Host(`${DOMAIN}`) || Host(`${DOMAIN2}`)) && PathPrefix(`/images`)"
      - "traefik.http.routers.backend-images.entrypoints=websecure"
      - "traefik.http.routers.backend-images.tls=true"
      - "traefik.http.routers.backend-images.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend-images.service=backend"
      - "traefik.http.routers.backend-images.middlewares=images-ratelimit@docker"
      - "traefik.http.routers.backend-images.priority=200"
      # Gallery ZIP download request (strict limit)
      - "traefik.http.routers.backend-downloads.rule=(Host(`${DOMAIN}`) || Host(`${DOMAIN2}`)) && PathPrefix(`/api/galleries`) && Path(`/{slug}/download`)"
      - "traefik.http.routers.backend-downloads.entrypoints=websecure"
      - "traefik.http.routers.backend-downloads.tls=true"
      - "traefik.http.routers.backend-downloads.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend-downloads.service=backend"
      - "traefik.http.routers.backend-downloads.middlewares=download-ratelimit@docker"
      - "traefik.http.routers.backend-downloads.priority=300"
      # ZIP file retrieval (strict limit)
      - "traefik.http.routers.backend-download-file.rule=(Host(`${DOMAIN}`) || Host(`${DOMAIN2}`)) && PathPrefix(`/api/downloads`)"
      - "traefik.http.routers.backend-download-file.entrypoints=websecure"
      - "traefik.http.routers.backend-download-file.tls=true"
      - "traefik.http.routers.backend-download-file.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend-download-file.service=backend"
      - "traefik.http.routers.backend-download-file.middlewares=download-ratelimit@docker"
      - "traefik.http.routers.backend-download-file.priority=300"
      # General API (moderate limit)
      - "traefik.http.routers.backend.rule=(Host(`${DOMAIN}`) || Host(`${DOMAIN2}`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend.service=backend"
      - "traefik.http.routers.backend.middlewares=api-ratelimit@docker"
      # Rate limit: images - 5000 req/min, burst 500 (thumbnails + full res browsing)
      - "traefik.http.middlewares.images-ratelimit.ratelimit.average=5000"
      - "traefik.http.middlewares.images-ratelimit.ratelimit.burst=500"
      - "traefik.http.middlewares.images-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.images-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=1"
      # Rate limit: general API - 300 req/min, burst 100
      - "traefik.http.middlewares.api-ratelimit.ratelimit.average=300"
      - "traefik.http.middlewares.api-ratelimit.ratelimit.burst=100"
      - "traefik.http.middlewares.api-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.api-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=1"
      # Rate limit: ZIP downloads - 3 req/min, burst 2 (expensive operation)
      - "traefik.http.middlewares.download-ratelimit.ratelimit.average=3"
      - "traefik.http.middlewares.download-ratelimit.ratelimit.burst=2"
      - "traefik.http.middlewares.download-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.download-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=1"
      # Service
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gallery-frontend
    restart: unless-stopped
    networks:
      - gallery-network
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=(Host(`${DOMAIN}`) || Host(`${DOMAIN2}`)) && PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.service=frontend"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

networks:
  gallery-network:
    driver: bridge

volumes:
  traefik-acme:
  mariadb-data:
  redis-data:
  gallery-data:
